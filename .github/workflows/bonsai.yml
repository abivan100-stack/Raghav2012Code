# Reliability notes:
#  - fetch-depth:0 + rebase-before-push + retry: main can move between checkout and
#    push (profile edits, another run). Without the rebase the push is rejected and
#    that day's re-grow is silently skipped.
#  - concurrency group prevents a scheduled run overlapping a manual one.
#  - the v1 build of the action does not expose its style/species outputs, so the
#    commit message records the measured tree size instead.
name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'   # re-grow daily
  workflow_dispatch:

permissions:
  contents: write

# never let a scheduled run overlap a manual one
concurrency:
  group: bonsai
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the rebase-before-push always has a base

      - uses: egorthinks/git-bonsai@v1
        with:
          user: Raghav2012Code
          commit: 'false'   # we commit below, after trimming

      - name: Trim the empty sky from the tree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          # %@ gives the content bounding box *including its offset within the original*.
          # Do NOT -trim first: that collapses the offset to +0+0 and yields an
          # empty corner instead of the tree.
          GEO=$(convert output/bonsai.gif -coalesce -background none -alpha set \
                  -flatten -format "%@" info:)
          echo "bonsai crop geometry: $GEO"
          convert output/bonsai.gif -coalesce -crop "$GEO" +repage output/_trim.gif
          mv output/_trim.gif output/bonsai.gif
          GGEO=$(convert output/bonsai-growth.gif -coalesce -background none -alpha set \
                  -flatten -format "%@" info:)
          echo "growth crop geometry: $GGEO"
          convert output/bonsai-growth.gif -coalesce -crop "$GGEO" +repage output/bonsai-growth.gif
          convert output/bonsai.png -background none -alpha set -trim +repage output/bonsai.png

      - name: Verify the tree survived the crop
        id: verify
        run: |
          set -e
          # read metadata from frame 0 only: identify repeats %w/%h for every frame
          W=$(identify -format "%w" "output/bonsai.gif[0]")
          H=$(identify -format "%h" "output/bonsai.gif[0]")
          FR=$(identify output/bonsai.gif | wc -l)
          MEAN=$(convert "output/bonsai.gif[0]" -alpha extract -format "%[fx:mean]" info:)
          echo "tree: ${W}x${H}  frames=${FR}  mean-opacity=${MEAN}"
          test "$W" -lt 256 || { echo "TRIM DID NOT SHRINK"; exit 1; }
          test "$FR" -gt 1  || { echo "ANIMATION LOST"; exit 1; }
          awk -v m="$MEAN" 'BEGIN{ if (m+0 < 0.05) { print "CROP IS BLANK - tree missing"; exit 1 } }'
          # the v1 build of the action does not expose its style/species outputs,
          # so record the tree's measured size instead - that is the daily signal.
          echo "tree=${W}x${H}" >> "$GITHUB_OUTPUT"
          echo "frames=${FR}"   >> "$GITHUB_OUTPUT"

      - name: Compose the README sheet cell
        # the README shows the tree at the end of its Projects band (output/bonsai-cell.gif).
        # Non-blocking: if this fails, today's tree is still committed and the cell keeps
        # yesterday's tree rather than losing the whole re-grow.
        continue-on-error: true
        run: |
          # apt, not pip: ubuntu-24.04 runners refuse system-wide pip installs (PEP 668)
          sudo apt-get install -y -qq python3-pil
          python3 .github/scripts/bonsai_cell.py output/bonsai.gif output/bonsai-cell.gif

      - name: Summarise
        env:
          TREE: ${{ steps.verify.outputs.tree }}
          FRAMES: ${{ steps.verify.outputs.frames }}
        run: |
          echo "### bonsai today: ${TREE} (${FRAMES} frames)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        env:
          TREE: ${{ steps.verify.outputs.tree }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tree unchanged today (${TREE}); nothing to commit"
            exit 0
          fi
          git commit -m "chore: tend the bonsai (${TREE})"
          # main can move between checkout and push (profile edits, another run),
          # which would reject the push and silently skip that day's re-grow.
          ok=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "${GITHUB_REF_NAME}"; then
              ok=1
              break
            fi
            echo "push attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done
          test "$ok" = "1" || { echo "could not push after 3 attempts"; exit 1; }
